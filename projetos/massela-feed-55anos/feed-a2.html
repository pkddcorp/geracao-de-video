<!doctype html><html><head><meta charset="utf-8">
<!-- VARIAÇÃO A — "Número vazado": painel azul com o 55 recortado mostrando a sacaria do galpão por dentro. -->
<style>
@font-face{font-family:Din;src:url(assets/fontes/bahnschrift.ttf);font-weight:300 700;font-stretch:75% 100%}
*{margin:0;padding:0;box-sizing:border-box}html,body{width:1080px;height:1920px;overflow:hidden;background:#fff}
#stage{position:relative;width:1080px;height:1350px;overflow:hidden;font-family:Din,sans-serif;color:#fff}
.abs{position:absolute}.center{left:0;right:0;text-align:center}
.cond{font-stretch:75%;font-weight:700;text-transform:uppercase}
.kick{font-size:34px;letter-spacing:.3em;font-weight:600;font-stretch:85%}
.placa{display:inline-block;position:relative;background:#f4b31a;color:#0d1a5c;padding:.17em .24em .06em}
.placa::after{content:'';position:absolute;right:-1px;top:-1px;width:.34em;height:.12em;background:#fff}
</style></head><body>
<div id="stage">
 <svg class="abs" style="inset:0" width="1080" height="1350" viewBox="0 0 1080 1350">
  <defs>
   <linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a2c8f"/><stop offset="1" stop-color="#0b1650"/></linearGradient>
   <pattern id="gr" width="90" height="90" patternUnits="userSpaceOnUse"><path d="M90 0H0V90" fill="none" stroke="rgba(255,255,255,.045)" stroke-width="3"/></pattern>
   <mask id="m"><rect width="1080" height="1350" fill="#fff"/>
    <text x="585" y="930" text-anchor="middle" style="font-family:Din;font-weight:700;font-stretch:75%;font-size:760px;letter-spacing:-10px" fill="#000">55</text></mask>
  </defs>
  <image href="assets/caminhao.jpg" x="-700" y="-720" width="1900" height="3378" preserveAspectRatio="xMidYMid slice" style="filter:brightness(1.1) saturate(1.2)"/>
  <g mask="url(#m)"><rect width="1080" height="1350" fill="url(#g)"/><rect width="1080" height="1350" fill="url(#gr)"/></g>
  <text x="585" y="930" text-anchor="middle" style="font-family:Din;font-weight:700;font-stretch:75%;font-size:760px;letter-spacing:-10px" fill="none" stroke="#f4b31a" stroke-width="5">55</text>
  <text x="222" y="560" text-anchor="middle" style="font-family:Din;font-weight:700;font-size:230px" fill="#f4b31a">+</text>
 </svg>
 <div class="abs center kick" style="top:120px;color:rgba(255,255,255,.8)">DEPÓSITO MASSELA · ITU</div>
 <div class="abs center cond" style="top:990px;font-size:96px;line-height:1"><span class="placa">anos no mercado</span></div>
 <div class="abs" style="left:0;right:0;top:1170px;height:120px;display:flex;align-items:center;justify-content:center;gap:34px">
  <div style="background:#fff;border-radius:10px;padding:12px 16px 8px"><img src="assets/logo.png" style="width:170px;display:block"></div>
  <div style="font-size:30px;line-height:1.35;opacity:.9">Material de construção<br>e aluguel de caçambas</div>
 </div>
</div>
<script>window.render=async()=>{};window.ready=Promise.all([...document.images].map(i=>i.decode().catch(()=>{}))).then(()=>document.fonts.ready).then(()=>({duracao:1,videos:[],cortes:[]}));</script>
</body></html>
