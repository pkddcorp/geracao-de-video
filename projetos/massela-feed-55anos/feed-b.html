<!doctype html><html><head><meta charset="utf-8">
<!-- VARIAÇÃO B — "Trena": fundo concreto claro, 55 gigante e uma trena amarela (ilustração própria) medindo até o 55. -->
<style>
@font-face{font-family:Din;src:url(assets/fontes/bahnschrift.ttf);font-weight:300 700;font-stretch:75% 100%}
*{margin:0;padding:0;box-sizing:border-box}html,body{width:1080px;height:1920px;overflow:hidden;background:#fff}
#stage{position:relative;width:1080px;height:1350px;overflow:hidden;font-family:Din,sans-serif;color:#15277a;background:linear-gradient(180deg,#f6f7f9,#e3e7ed)}
.grade{position:absolute;inset:0;background-image:linear-gradient(rgba(21,39,122,.04) 2px,transparent 2px),linear-gradient(90deg,rgba(21,39,122,.04) 2px,transparent 2px);background-size:90px 90px}
.abs{position:absolute}.center{left:0;right:0;text-align:center}
.cond{font-stretch:75%;font-weight:700;text-transform:uppercase}
.kick{font-size:32px;letter-spacing:.3em;font-weight:600;font-stretch:85%;color:#5a6479}
.kick .sq{width:18px;height:18px;background:#f4b31a;display:inline-block;margin-right:18px;vertical-align:.1em}
.placa{display:inline-block;position:relative;background:#15277a;color:#fff;padding:.17em .24em .06em}
.placa::after{content:'';position:absolute;right:-1px;top:-1px;width:.34em;height:.12em;background:#f4b31a}
.base{position:absolute;left:0;right:0;bottom:0;height:78px;background:#15277a;display:flex;align-items:center;justify-content:center;gap:24px;color:#fff;font-size:26px;letter-spacing:.3em;font-weight:600}
.base i{display:block;width:110px;height:2px;background:rgba(255,255,255,.7)}
</style></head><body>
<div id="stage">
 <div class="grade"></div>
 <img class="abs" src="assets/logo.png" style="left:50%;top:90px;width:300px;margin-left:-150px;filter:drop-shadow(0 12px 20px rgba(13,26,92,.18))">
 <div class="abs center kick" style="top:300px"><span class="sq"></span>DEPÓSITO MASSELA</div>
 <div class="abs center cond" style="top:330px;font-size:470px;line-height:1;letter-spacing:-.01em"><span style="color:#f4b31a;font-size:.55em;vertical-align:.55em">+</span>55</div>
 <div class="abs center cond" style="top:800px;font-size:96px;line-height:1"><span class="placa">anos no mercado</span></div>
 <!-- trena -->
 <svg class="abs" style="left:0;top:980px" width="1080" height="230" viewBox="0 0 1080 230" overflow="visible">
  <g transform="rotate(-4 540 115)">
   <rect x="170" y="70" width="870" height="96" fill="#f4b31a"/>
   <rect x="170" y="70" width="870" height="8" fill="rgba(0,0,0,.08)"/>
   <g id="ticks"></g>
   <path d="M1040 62h26v112h-26z" fill="#9aa3b5"/><path d="M1052 62h14v112h-14z" fill="#7d879b"/>
   <rect x="20" y="20" width="200" height="196" rx="34" fill="#15277a"/>
   <rect x="36" y="36" width="168" height="164" rx="24" fill="none" stroke="rgba(255,255,255,.25)" stroke-width="4"/>
   <circle cx="120" cy="118" r="44" fill="#0d1a5c" stroke="#f4b31a" stroke-width="8"/><circle cx="120" cy="118" r="12" fill="#f4b31a"/>
  </g>
 </svg>
 <div class="base"><i></i>ITU – SP · @DEPOSITOMASSELA<i></i></div>
</div>
<script>
// marcações da trena: 0..55 ao longo de 820px, número a cada 10 e destaque no 55
const g=document.getElementById('ticks');let h='';const x0=205,x1=1010;
for(let v=0;v<=55;v++){const x=x0+(x1-x0)*v/55;const big=v%10===0||v===55,mid=v%5===0;
 h+=`<line x1="${x}" y1="70" x2="${x}" y2="${70+(big?44:mid?30:16)}" stroke="#0d1a5c" stroke-width="${big?4:2.5}"/>`;
 if(v%10===0&&v>0)h+=`<text x="${x}" y="152" text-anchor="middle" style="font-family:Din;font-weight:700;font-stretch:75%;font-size:36px" fill="#0d1a5c">${v}</text>`;}
const x55=x1;h+=`<rect x="${x55-44}" y="112" width="88" height="48" fill="#15277a"/><text x="${x55}" y="150" text-anchor="middle" style="font-family:Din;font-weight:700;font-stretch:75%;font-size:40px" fill="#fff">55</text>`;
g.innerHTML=h;
window.render=async()=>{};window.ready=Promise.all([...document.images].map(i=>i.decode().catch(()=>{}))).then(()=>document.fonts.ready).then(()=>({duracao:1,videos:[],cortes:[]}));</script>
</body></html>
