<!doctype html><html><head><meta charset="utf-8">
<!-- APRESENTAÇÃO DO ESTÚDIO — "Ágatha, uma IA criada só para fazer vídeos".
     Identidade futurista (mesma da imagem estudio-ia): preto-azulado, ciano → violeta → magenta, núcleo de IA (orbe com anéis),
     HUD em fonte mono, títulos condensados. Troca de cena = linha de varredura ciano da esquerda pra direita.
     Os trabalhos reais passam em TELA CHEIA com moldura de HUD. -->
<style>
@font-face{font-family:Din;src:url(assets/fontes/bahnschrift.ttf);font-weight:300 700;font-stretch:75% 100%}
@font-face{font-family:Mono;src:url(assets/fontes/consola.ttf)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:#04050b;font-family:Din,sans-serif;color:#eaf6ff}
.abs{position:absolute}.center{left:0;right:0;text-align:center}
.S{position:absolute;inset:0;overflow:hidden;visibility:hidden;background:#04050b}
.g1{position:absolute;left:-300px;top:-200px;width:1000px;height:1000px;background:radial-gradient(circle,rgba(34,211,238,.22),transparent 62%)}
.g2{position:absolute;right:-340px;top:700px;width:1100px;height:1100px;background:radial-gradient(circle,rgba(139,92,246,.26),transparent 60%)}
.chao{position:absolute;left:-540px;right:-540px;top:1380px;height:900px;transform:perspective(520px) rotateX(64deg);transform-origin:50% 0;
 background-image:linear-gradient(rgba(56,189,248,.25) 2px,transparent 2px),linear-gradient(90deg,rgba(56,189,248,.25) 2px,transparent 2px);background-size:80px 80px;
 -webkit-mask-image:linear-gradient(180deg,transparent 0%,#000 20%,#000 50%,transparent 95%)}
.scan{position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.022) 0 1px,transparent 1px 4px);pointer-events:none;z-index:40}
.mono{font-family:Mono,monospace;letter-spacing:.08em}
.hud{font-size:26px;color:rgba(186,230,253,.8)}
.H{font-weight:700;font-stretch:78%;text-transform:uppercase;line-height:1.12;padding-top:.08em}
.grad{background:linear-gradient(90deg,#22d3ee 0%,#818cf8 55%,#e879f9 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 26px rgba(129,140,248,.55))}
.ln{overflow:hidden;display:block;padding-top:.16em;margin-top:-.16em}.ln>span{display:inline-block}
img.m{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.canto{position:absolute;width:90px;height:90px;border-color:#22d3ee;border-style:solid;filter:drop-shadow(0 0 8px #22d3ee)}
.rot{position:absolute;left:70px;bottom:190px;padding:18px 26px;border-radius:14px;background:rgba(3,7,18,.78);border:1.5px solid rgba(125,211,252,.55);box-shadow:0 0 30px rgba(34,211,238,.25)}
.ok{position:absolute;right:70px;bottom:206px;padding:14px 22px;border-radius:12px;background:rgba(3,7,18,.78);border:1.5px solid rgba(52,211,153,.6);color:#a7f3d0;font-size:24px}
.passo{position:absolute;left:150px;right:80px;display:flex;align-items:center;gap:44px}
.no{flex:none;width:130px;height:130px;border-radius:50%;border:3px solid #22d3ee;display:flex;align-items:center;justify-content:center;font-family:Mono;font-size:44px;color:#cffafe;background:rgba(8,20,40,.8);box-shadow:0 0 30px rgba(34,211,238,.45),inset 0 0 20px rgba(34,211,238,.25)}
.passo .t1{font-size:78px;font-weight:700;font-stretch:78%;text-transform:uppercase;display:block;line-height:1.05}
.passo .t2{font-size:44px;color:#a5b4fc;display:block}
.chip{position:absolute;width:420px;height:150px;border-radius:24px;border:2px solid rgba(125,211,252,.6);background:rgba(8,20,40,.65);display:flex;align-items:center;justify-content:center;gap:18px;font-size:64px;font-weight:700;font-stretch:78%;text-transform:uppercase;box-shadow:0 0 30px rgba(34,211,238,.2),inset 0 0 24px rgba(34,211,238,.12)}
.chip i{width:16px;height:16px;border-radius:50%;background:#22d3ee;box-shadow:0 0 14px #22d3ee}
.cta{position:absolute;left:50%;padding:36px 64px;border-radius:20px;background:linear-gradient(90deg,#06b6d4,#6366f1 60%,#c026d3);color:#fff;font-size:48px;font-weight:700;font-stretch:85%;letter-spacing:.05em;white-space:nowrap;overflow:hidden;box-shadow:0 0 40px rgba(99,102,241,.6),0 20px 50px rgba(0,0,0,.5)}
.cta .sh{position:absolute;top:0;bottom:0;width:170px;background:linear-gradient(100deg,transparent,rgba(255,255,255,.5),transparent);transform:skewX(-20deg)}
#varre{position:absolute;top:0;bottom:0;width:8px;z-index:30;visibility:hidden;background:#cffafe;box-shadow:0 0 30px 10px rgba(34,211,238,.85),0 0 4px 2px #fff}
</style></head><body>
<div id="stage"><div id="varre"></div><div class="scan"></div></div>
<script>
const $=id=>document.getElementById(id);
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),seg=(t,a,b)=>cl((t-a)/(b-a));
const eQ=p=>1-Math.pow(1-p,5),eIO=p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2,eSine=p=>-(Math.cos(Math.PI*p)-1)/2;
const eBack=p=>{const c=1.4,c3=c+1;return 1+c3*Math.pow(p-1,3)+c*Math.pow(p-1,2)};
const lerp=(a,b,p)=>a+(b-a)*p;const pad=n=>String(n).padStart(4,'0');
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
const PROJ=location.pathname.replace(/\/[^/]*$/,'');const url=f=>`${PROJ}/${f}`;
let P,SEQ=[],MEDIA={};
const ln=(txt,d,cls='',style='')=>`<span class="ln"><span class="r ${cls}" data-d="${d}" style="${style}">${txt}</span></span>`;
const fundo=(chao=true)=>`<div class="g1"></div><div class="g2"></div>${chao?'<div class="chao"></div>':''}`;
// núcleo de IA (orbe + anéis) centrado em (cx,cy) com raio base r
// NÚCLEO PKDD — interface holográfica estilo HUD (anéis finos segmentados, marcações, onda de voz radial, nome no centro).
// Tudo ilustração própria. r = raio do miolo; o conjunto ocupa ~2.3r.
const arco=(R,a0,a1)=>{const p=a=>[R*Math.cos((a-90)*Math.PI/180),R*Math.sin((a-90)*Math.PI/180)];const [x0,y0]=p(a0),[x1,y1]=p(a1);return 'M'+x0.toFixed(1)+' '+y0.toFixed(1)+'A'+R+' '+R+' 0 '+((a1-a0)>180?1:0)+' 1 '+x1.toFixed(1)+' '+y1.toFixed(1);};
const orbe=(id,cx,cy,r)=>{const S=r*2.4;const C='#5eeaff';let h='';
 h+='<defs><radialGradient id="gl'+id+'" r=".5"><stop offset="0" stop-color="rgba(94,234,255,.55)"/><stop offset=".55" stop-color="rgba(56,130,255,.18)"/><stop offset="1" stop-color="rgba(56,130,255,0)"/></radialGradient></defs>';
 h+='<circle r="'+(r*2.3)+'" fill="url(#gl'+id+')"/>';
 // anel externo com marcações
 let tk='';for(let k=0;k<120;k++){const L=k%10===0?r*.14:(k%5===0?r*.09:r*.05);const ang=k*3*Math.PI/180;const R0=r*2.05;
  tk+='<line x1="'+(Math.sin(ang)*R0).toFixed(1)+'" y1="'+(-Math.cos(ang)*R0).toFixed(1)+'" x2="'+(Math.sin(ang)*(R0-L)).toFixed(1)+'" y2="'+(-Math.cos(ang)*(R0-L)).toFixed(1)+'"/>';}
 h+='<g class="h1 dr" data-d="0" stroke="'+C+'" stroke-width="2" opacity=".75">'+tk+'<circle r="'+(r*2.12)+'" fill="none" stroke-width="1.5"/></g>';
 // anel segmentado
 h+='<g class="h2 dr" data-d=".15" fill="none" stroke="'+C+'" stroke-width="'+(r*.07)+'" opacity=".9">'+[[0,48],[60,70],[80,150],[165,172],[185,260],[275,300],[315,352]].map(x=>'<path d="'+arco(r*1.82,x[0],x[1])+'"/>').join('')+'</g>';
 // arcos grossos laranja/ciano (destaques)
 h+='<g class="h3 dr" data-d=".3" fill="none" stroke-linecap="butt"><path d="'+arco(r*1.6,20,95)+'" stroke="'+C+'" stroke-width="'+(r*.16)+'" opacity=".55"/><path d="'+arco(r*1.6,200,238)+'" stroke="#ffb547" stroke-width="'+(r*.16)+'" opacity=".85"/><path d="'+arco(r*1.6,250,262)+'" stroke="#ffb547" stroke-width="'+(r*.16)+'" opacity=".5"/></g>';
 // anel de blocos (tipo reator)
 let bl='';for(let k=0;k<48;k++){bl+='<rect x="'+(-r*.035)+'" y="'+(-r*1.42)+'" width="'+(r*.07)+'" height="'+(r*.14)+'" transform="rotate('+(k*7.5)+')" opacity="'+(k%6===0?1:.45)+'"/>';}
 h+='<g class="h4 dr" data-d=".45" fill="'+C+'">'+bl+'</g>';
 // onda de voz radial
 let wv='';for(let k=0;k<72;k++){wv+='<line class="wv" data-k="'+k+'" x1="0" y1="'+(-r*1.05)+'" x2="0" y2="'+(-r*1.2)+'" transform="rotate('+(k*5)+')"/>';}
 h+='<g class="h5" stroke="'+C+'" stroke-width="'+(r*.035)+'" stroke-linecap="round">'+wv+'</g>';
 // miolo
 h+='<circle r="'+(r*.98)+'" fill="rgba(4,12,28,.85)" stroke="'+C+'" stroke-width="3"/>';
 h+='<circle class="h6" r="'+(r*.86)+'" fill="none" stroke="'+C+'" stroke-width="1.5" stroke-dasharray="3 9" opacity=".8"/>';
 h+='<text y="'+(r*.2)+'" text-anchor="middle" font-family="Din" font-weight="700" font-size="'+(r*.62)+'" fill="#e6fbff" letter-spacing="'+(r*.03)+'" style="filter:drop-shadow(0 0 '+(r*.12)+'px #5eeaff)">PKDD</text>';
 h+='<text y="'+(r*.52)+'" text-anchor="middle" font-family="Mono" font-size="'+(r*.13)+'" fill="#7fdcff" letter-spacing="'+(r*.02)+'">IA DE VÍDEO</text>';
 // leituras laterais
 h+='<g font-family="Mono" font-size="'+(r*.13)+'" fill="#9be9ff" class="lt"><text x="'+(r*1.35)+'" y="'+(-r*1.95)+'">SYS 98.7%</text><text x="'+(-r*2.25)+'" y="'+(r*2.05)+'">RENDER ▸ ON</text></g>';
 return '<svg class="abs orbe" id="'+id+'" style="left:'+(cx-S)+'px;top:'+(cy-S)+'px;overflow:visible" width="'+(2*S)+'" height="'+(2*S)+'" viewBox="'+(-S)+' '+(-S)+' '+(2*S)+' '+(2*S)+'">'+h+'</svg>';};

function construir(){
 let t=0;const st=$('stage');
 P.cenas.forEach((c,i)=>{const a=t,b=t+c.dur;t=b;const el=document.createElement('div');el.id='S'+i;el.className='S';let h='';
  if(c.tipo==='boot'){
   h=fundo()+`<div class="abs mono hud digit" data-txt="> iniciando sistema..." data-d=".1" style="left:90px;top:300px;font-size:32px"></div>
    <div class="abs mono hud digit" data-txt="> núcleo de vídeo: ONLINE" data-d=".7" style="left:90px;top:356px;color:#6ee7b7;font-size:32px"></div>
    ${orbe('ob'+i,540,760,140)}
    <div class="abs center mono" style="top:1180px;font-size:40px;color:#a5b4fc;letter-spacing:.3em">${ln('OLÁ. EU SOU',1.0)}</div>
    <div class="abs center H" style="top:1235px;font-size:240px;line-height:1.05">${ln(esc(P.nome_ia).toUpperCase(),1.25,'grad')}</div>`;
  }else if(c.tipo==='manifesto'){
   h=fundo()+orbe('ob'+i,540,420,80)+`
    <div class="abs center H" style="top:690px;font-size:140px">${c.linhas.map((l,j)=>ln(esc(l),.1+j*.15)).join('')}</div>
    <div class="abs center H" style="top:1010px;font-size:250px;line-height:1.05">${ln(esc(c.destaque),.5,'grad')}</div>`;
  }else if(c.tipo==='clipe'){MEDIA[c.arquivo]=true;
   h=`<img class="m mB"><div class="abs" style="inset:0;background:linear-gradient(180deg,rgba(4,5,11,.55) 0%,rgba(4,5,11,0) 20%)"></div>
    <div class="canto" style="left:36px;top:180px;border-width:6px 0 0 6px"></div><div class="canto" style="right:36px;top:180px;border-width:6px 6px 0 0"></div>
    <div class="canto" style="left:36px;bottom:150px;border-width:0 0 6px 6px"></div><div class="canto" style="right:36px;bottom:150px;border-width:0 6px 6px 0"></div>
    <div class="rot fd" data-d=".15" style="${c.topo?'bottom:auto;top:60px':''}"><div class="mono" style="font-size:22px;color:#67e8f9">PROJETO ${esc(c.n)} // ${esc(c.formato).toUpperCase()}</div>
     <div style="font-size:52px;font-weight:700;font-stretch:80%;text-transform:uppercase;margin-top:4px">${esc(c.projeto)}</div></div>
    <div class="ok mono fd" data-d=".5" style="${c.topo?'bottom:auto;top:76px':''}">✓ RENDER 100%</div>`;
  }else if(c.tipo==='processo'){
   h=fundo(false)+`<div class="abs center mono" style="top:470px;font-size:34px;color:#67e8f9;letter-spacing:.25em">${ln(esc(c.kicker).toUpperCase(),.05)}</div>
    <svg class="abs" style="left:213px;top:670px" width="6" height="640"><line class="fio" x1="3" y1="0" x2="3" y2="640" stroke="#22d3ee" stroke-width="4" stroke-dasharray="640" stroke-dashoffset="640" style="filter:drop-shadow(0 0 6px #22d3ee)"/></svg>
    ${c.itens.map((x,j)=>`<div class="passo fi" data-d="${.3+j*.55}" style="top:${610+j*300}px"><div class="no">0${j+1}</div><span><span class="t1">${esc(x[0])}</span><span class="t2">${esc(x[1])}</span></span></div>`).join('')}`;
  }else if(c.tipo==='formatos'){
   h=fundo()+`<div class="abs center H" style="top:380px;font-size:112px">${ln(esc(c.titulo),.05)}</div>
    <div class="abs center H" style="top:510px;font-size:140px">${ln(esc(c.destaque),.25,'grad')}</div>
    ${c.itens.map((x,j)=>`<div class="chip pop" data-d="${.55+j*.18}" style="left:${j%2?570:90}px;top:${860+Math.floor(j/2)*190}px"><i></i>${esc(x)}</div>`).join('')}`;
  }else if(c.tipo==='final'){
   h=fundo()+orbe('ob'+i,540,560,120)+`
    <div class="abs center H" style="top:900px;font-size:140px">${ln(esc(c.titulo),.3)}</div>
    <div class="abs center H" style="top:1050px;font-size:190px;line-height:1.05">${ln(esc(c.destaque),.5,'grad')}</div>
    <div class="cta fi" data-d=".9" style="top:1330px">${esc(c.botao)}<div class="sh"></div></div>
    <div class="abs center mono hud fd" data-d="1.3" style="top:1500px;font-size:26px">[ ${esc(P.nome_ia).toUpperCase()} // IA DE VÍDEO ]</div>`;
  }
  el.innerHTML=h;st.appendChild(el);SEQ.push({c,el,a,b});
 });
 window.DURACAO=t;
}
function srcOf(f,lt){const q=window.QUADROS[f];const n=Math.min(q.n,Math.max(1,Math.floor(lt*30)+1));return `/${q.pasta}/${pad(n)}.jpg`;}
const setImg=(el,src)=>{if(el.dataset.s!==src){el.dataset.s=src;el.src=src;return el.decode().catch(()=>{});}return null;};
function anim(s,lt,waits){const el=s.el;
 el.querySelectorAll('.r').forEach(x=>{const d=+x.dataset.d,p=eQ(seg(lt,d,d+.7));x.style.transform=`translateY(${(1-p)*110}%)`;x.style.filter=`blur(${(1-p)*6}px)`;});
 el.querySelectorAll('.digit').forEach(x=>{const d=+x.dataset.d,tx=x.dataset.txt;const n=Math.floor(seg(lt,d,d+.5)*tx.length);x.textContent=tx.slice(0,n)+(lt>d&&Math.floor(lt*4)%2===0?'▌':'');});
 el.querySelectorAll('.fd').forEach(x=>{const d=+x.dataset.d,p=eQ(seg(lt,d,d+.5));x.style.opacity=p;x.style.transform=`translateY(${(1-p)*-20}px)`;});
 el.querySelectorAll('.fi').forEach(x=>{const d=+x.dataset.d,p=eQ(seg(lt,d,d+.6));x.style.opacity=cl(seg(lt,d,d+.25));
  x.style.transform=(x.classList.contains('cta')?'translateX(-50%) ':'')+`translateX(${x.classList.contains('cta')?0:(1-p)*-60}px) translateY(${x.classList.contains('cta')?(1-p)*40:0}px)`;
  const sh=x.querySelector('.sh');if(sh)sh.style.left=`${lerp(-240,900,eIO((((lt-d-.7)%2)+2)%2/1))}px`;});
 el.querySelectorAll('.pop').forEach(x=>{const d=+x.dataset.d,p=eBack(seg(lt,d,d+.45));x.style.opacity=cl(seg(lt,d,d+.12));x.style.transform=`scale(${lerp(.5,1,p)})`;});
 el.querySelectorAll('.fio').forEach(x=>{x.style.strokeDashoffset=640*(1-eIO(seg(lt,.4,1.6)));});
 el.querySelectorAll('.orbe').forEach(o=>{const boot=s.c.tipo==='boot';const p=boot?eQ(seg(lt,.2,1.0)):eQ(seg(lt,0,.5));
  o.style.transform='scale('+lerp(boot?.6:.9,1,p)+')';o.style.opacity=cl(boot?seg(lt,.2,.45):seg(lt,0,.25));
  const g=q=>o.querySelector(q);g('.h1').setAttribute('transform','rotate('+(lt*8)+')');g('.h2').setAttribute('transform','rotate('+(-lt*30)+')');
  g('.h3').setAttribute('transform','rotate('+(lt*55)+')');g('.h4').setAttribute('transform','rotate('+(-lt*12)+')');g('.h6').setAttribute('transform','rotate('+(lt*40)+')');
  o.querySelectorAll('.dr').forEach(x=>{const d=+x.dataset.d+(boot?.2:0);x.style.opacity=cl(seg(lt,d,d+.35))*(x.classList.contains('h1')?.75:1);});
  const fala=boot?cl(seg(lt,.9,1.1)):1; // onda de voz "falando"
  o.querySelectorAll('.wv').forEach(w=>{const k=+w.dataset.k;const amp=(.5+.5*Math.sin(lt*9+k*.7))*(.5+.5*Math.sin(lt*5.3-k*.31))*fala;const r0=-parseFloat(w.getAttribute('y1'));
   w.setAttribute('y2',(-(r0*(1.04+amp*.32))).toFixed(1));w.style.opacity=.35+amp*.65;});
  o.querySelector('.lt').style.opacity=cl(seg(lt,boot?1.2:.4,boot?1.5:.7));});
 if(s.c.tipo==='clipe'){const B=el.querySelector('.mB');waits.push(setImg(B,srcOf(s.c.arquivo,Math.max(0,lt))));B.style.transform=`scale(${lerp(1.04,1,eQ(seg(lt,0,s.b-s.a)))})`;}
}
const T=.45;
window.render=async function(t){
 const waits=[];let i=SEQ.findIndex(s=>t>=s.a&&t<s.b);if(i<0)i=SEQ.length-1;const cur=SEQ[i],prev=SEQ[i-1];const lt=t-cur.a;
 SEQ.forEach(s=>{s.el.style.visibility='hidden';s.el.style.clipPath='none';s.el.style.zIndex=1;});$('varre').style.visibility='hidden';
 cur.el.style.visibility='visible';cur.el.style.zIndex=2;anim(cur,lt,waits);
 if(prev&&lt<T){const p=eIO(seg(lt,0,T));prev.el.style.visibility='visible';anim(prev,prev.b-prev.a+lt,waits);
  cur.el.style.clipPath=`inset(0 ${(1-p)*100}% 0 0)`;const v=$('varre');v.style.visibility=p<1?'visible':'hidden';v.style.left=(p*1080-4)+'px';}
 await Promise.all(waits.filter(Boolean));
};
window.CORTES=()=>SEQ.slice(1).map(s=>s.a);
window.ready=fetch(`${PROJ}/projeto.json`).then(r=>r.json()).then(j=>{P=j;construir();
 return Promise.all([...document.images].map(i=>i.decode().catch(()=>{})));}).then(()=>document.fonts.ready).then(()=>({duracao:window.DURACAO,videos:Object.keys(MEDIA),cortes:window.CORTES()}));
</script></body></html>
